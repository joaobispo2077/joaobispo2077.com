name: Measure Code Quality

permissions:
  contents: read
  pull-requests: write
  checks: write

# GitHub-hosted runners: run JS-based actions on Node 24 (see deprecation of Node 20 for actions).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:

jobs:
  coverage-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Jest coverage report
        run: npm run test:coverage:report

      - name: Publish coverage report on PR
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          skip-step: all
          coverage-file: ./report.json
